<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ilhas</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1b2a3a; overflow: hidden; font-family: system-ui, sans-serif; }
    #jogo { width: 100vw; height: 100vh; }
    canvas, img { image-rendering: pixelated; }
    #barra { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; gap: 6px;
      padding: 6px; background: #2b2238cc; border: 2px solid #3a2f45; border-radius: 10px; max-width: calc(100vw - 32px); flex-wrap: wrap; justify-content: center; }
    .slot { position: relative; width: 44px; height: 44px; background: #f6efe0; border: 2px solid #3a2f45; border-radius: 6px; display: grid; place-items: center; }
    .slot img { width: 30px; height: 30px; }
    .slot b { position: absolute; right: 2px; bottom: 0; font-size: 12px; color: #3a2f45; }
    .slot i { position: absolute; left: 3px; bottom: 2px; height: 3px; background: #6db35c; border-radius: 2px; max-width: 70%; }
    .vazio { color: #f6efe0; font-size: 13px; padding: 8px; }
    #btn-craft { position: fixed; right: 12px; bottom: 12px; padding: 10px 14px; font-weight: 700; background: #ffb3c6;
      border: 2px solid #3a2f45; border-radius: 10px; cursor: pointer; }
    #craft { position: fixed; right: 12px; bottom: 64px; width: 280px; max-height: 70vh; overflow: auto; background: #f6efe0;
      border: 2px solid #3a2f45; border-radius: 10px; padding: 8px; }
    #craft h3 { margin: 4px 6px 8px; color: #3a2f45; } #craft small { color: #8a7f95; }
    #craft button { display: flex; gap: 8px; align-items: center; width: 100%; text-align: left; margin-bottom: 6px; padding: 6px;
      background: #fff; border: 2px solid #3a2f45; border-radius: 8px; cursor: pointer; font: inherit; color: #3a2f45; }
    #craft button:disabled { opacity: .55; cursor: default; }
    #craft button:not(:disabled):hover { background: #e9fbe0; }
    .grande { width: 32px; height: 32px; } .custo { display: flex; gap: 8px; font-size: 12px; margin-top: 2px; }
    .custo img { width: 14px; height: 14px; vertical-align: -3px; margin-right: 2px; } .falta { color: #c0392b; }
    #avisos { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); display: grid; gap: 6px; pointer-events: none; }
    .aviso { background: #2b2238dd; color: #fff; padding: 6px 12px; border-radius: 8px; font-size: 14px; animation: some 2.6s forwards; }
    @keyframes some { 0%,80% { opacity: 1 } 100% { opacity: 0 } }
    #ajuda { position: fixed; top: 12px; left: 12px; color: #fff; background: #0007; padding: 6px 10px; border-radius: 8px; font-size: 12px; line-height: 1.5; }
  </style>
</head>
<body>
  <div id="jogo"></div>
  <div id="ajuda">WASD/setas: andar · Espaço: coletar · C: criar · roda: zoom</div>
  <div id="avisos"></div>
  <div id="barra"></div>
  <button id="btn-craft">Criar (C)</button>
  <div id="craft" hidden></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
