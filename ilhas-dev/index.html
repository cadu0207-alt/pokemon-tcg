<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#2b2238" />
  <title>Ilhas</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1b2a3a; overflow: hidden; font-family: system-ui, sans-serif;
      touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    #jogo { position: fixed; inset: 0; }
    canvas, img { image-rendering: pixelated; }
    button { font: inherit; color: #3a2f45; cursor: pointer; }
    .painel { background: #2b2238cc; border: 2px solid #3a2f45; border-radius: 10px; color: #f6efe0; }

    #barra { position: fixed; left: 0; right: 0; margin: 0 auto; width: max-content; bottom: max(12px, env(safe-area-inset-bottom));
      display: flex; gap: 6px; padding: 6px; max-width: calc(100vw - 32px); flex-wrap: wrap; justify-content: center; }
    .slot { position: relative; width: 44px; height: 44px; padding: 0; background: #f6efe0; border: 2px solid #3a2f45; border-radius: 6px; display: grid; place-items: center; }
    .slot.construivel { background: #fff4c7; } .slot.sel { outline: 3px solid #ffb3c6; }
    .slot img { width: 30px; height: 30px; }
    .slot b { position: absolute; right: 2px; bottom: 0; font-size: 12px; }
    .slot i { position: absolute; left: 3px; bottom: 2px; height: 3px; background: #6db35c; border-radius: 2px; max-width: 70%; }
    .vazio { font-size: 13px; padding: 8px; }

    #btn-craft { position: fixed; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); padding: 10px 14px; font-weight: 700;
      background: #ffb3c6; border: 2px solid #3a2f45; border-radius: 10px; }
    #craft { position: fixed; right: 12px; bottom: 64px; width: 290px; max-height: 70vh; overflow: auto; background: #f6efe0;
      border: 2px solid #3a2f45; border-radius: 10px; padding: 8px; color: #3a2f45; z-index: 5; }
    #craft h3 { margin: 4px 6px 8px; display: flex; align-items: center; gap: 6px; } #craft h3 small { color: #8a7f95; }
    .fechar { margin-left: auto; background: none; border: 0; font-size: 18px; }
    #craft button[data-r] { display: flex; gap: 8px; align-items: center; width: 100%; text-align: left; margin-bottom: 6px; padding: 6px;
      background: #fff; border: 2px solid #3a2f45; border-radius: 8px; }
    #craft button:disabled { opacity: .55; cursor: default; }
    #craft button[data-r]:not(:disabled):hover { background: #e9fbe0; }
    #craft .abas { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin: 0 0 8px; }
    #craft .aba { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 5px 2px; font-size: 10px; font-weight: 700;
      background: #fff; border: 2px solid #3a2f45; border-radius: 8px; }
    #craft .aba img { width: 22px; height: 22px; } #craft .aba.sel { background: #ffd166; box-shadow: inset 0 -3px 0 #e0a83a; }
    #craft .aba i { position: absolute; top: -6px; right: -4px; min-width: 16px; padding: 0 3px; border-radius: 8px; background: #6db35c; color: #fff; font-style: normal; font-size: 10px; line-height: 16px; }
    .grande { width: 32px; height: 32px; } .custo { display: flex; gap: 8px; font-size: 12px; margin-top: 2px; flex-wrap: wrap; }
    .custo img, .req img { width: 14px; height: 14px; vertical-align: -3px; margin-right: 2px; } .falta { color: #c0392b; }

    #status { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 12px; padding: 8px 10px; width: 170px; font-size: 12px; }
    #status .linha { display: flex; justify-content: space-between; margin-bottom: 4px; } #status .relogio { opacity: .85; }
    .bar { position: relative; height: 12px; background: #3a2f45; border-radius: 6px; overflow: hidden; margin-top: 4px; }
    .bar i { position: absolute; inset: 0 auto 0 0; transition: width .2s; } .bar.vida i { background: #e0607a; } .bar.xp i { background: #ffd166; }
    .bar span { position: relative; display: block; text-align: center; font-size: 10px; line-height: 12px; font-weight: 700; color: #fff; text-shadow: 0 1px 0 #3a2f45; }
    .slot.comida { background: #ffe3ea; }
    body.dano #jogo { animation: dano .25s; } @keyframes dano { 0% { filter: none } 30% { filter: sepia(1) saturate(4) hue-rotate(-40deg) } 100% { filter: none } }
    #btn-ranking { position: fixed; right: 12px; top: calc(max(12px, env(safe-area-inset-top)) + 104px); padding: 8px 12px; font-weight: 700;
      background: #ffd166; border: 2px solid #3a2f45; border-radius: 10px; }
    #ranking { position: fixed; right: 12px; top: calc(max(12px, env(safe-area-inset-top)) + 150px); width: 300px; max-height: calc(100vh - 170px); overflow: auto;
      background: #f6efe0; border: 2px solid #3a2f45; border-radius: 10px; padding: 8px; color: #3a2f45; z-index: 7; }
    #ranking h3 { margin: 2px 6px 4px; display: flex; align-items: center; } #ranking .sua { margin: 0 6px 6px; font-size: 13px; } #ranking .sua small { display: block; color: #8a7f95; font-size: 11px; }
    #ranking ol { list-style: none; margin: 0; padding: 0; }
    #ranking li { display: grid; grid-template-columns: 30px 1fr auto 44px; gap: 6px; align-items: center; padding: 4px 6px; border-radius: 6px; cursor: pointer; }
    #ranking li:hover { background: #fff; } #ranking li.eu { background: #ffe3ea; font-weight: 700; } #ranking li.sep { display: block; text-align: center; cursor: default; }
    #ranking li small { color: #8a7f95; font-size: 11px; } #ranking li em { font-style: normal; text-align: right; font-weight: 700; }
    body.toque #ranking { left: 8px; right: 8px; top: 60px; width: auto; max-height: calc(100vh - 140px); }
    #espectador { display: none; position: fixed; left: 0; right: 0; margin: 0 auto; width: max-content; max-width: calc(100vw - 24px);
      top: calc(max(12px, env(safe-area-inset-top)) + 90px); padding: 8px 12px; align-items: center; gap: 10px; z-index: 6; }
    body.espectador #espectador { display: flex; }
    #btn-voltar { padding: 6px 10px; font-weight: 700; background: #8fd27a; border: 2px solid #3a2f45; border-radius: 8px; }
    body.espectador #joy, body.espectador #btn-acao, body.espectador #barra { opacity: .35; pointer-events: none; }
    body.espectador #btn-craft, body.espectador #craft { display: none; }
    body.toque #espectador { top: calc(max(12px, env(safe-area-inset-top)) + 270px); }
    .bar.mana i { background: #7aa7ff; }
    #btn-hab { position: fixed; right: 12px; top: calc(max(12px, env(safe-area-inset-top)) + 150px); padding: 8px 12px; font-weight: 700;
      background: #c39bff; border: 2px solid #3a2f45; border-radius: 10px; }
    .badge { display: inline-block; min-width: 18px; padding: 0 4px; border-radius: 9px; background: #e0503c; color: #fff; font-size: 12px; }
    #habilidades { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(760px, calc(100vw - 24px)); max-height: calc(100vh - 40px);
      overflow: auto; background: #f6efe0; border: 2px solid #3a2f45; border-radius: 12px; padding: 10px; color: #3a2f45; z-index: 8; box-sizing: border-box; }
    #habilidades h3 { margin: 2px 4px 8px; display: flex; align-items: baseline; gap: 8px; } #habilidades h3 small { color: #8a7f95; font-weight: 400; }
    .ramos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .ramo h4 { margin: 0 0 6px; text-align: center; font-size: 13px; }
    .no { display: block; width: 100%; text-align: left; margin-bottom: 6px; padding: 6px; border: 2px solid #3a2f45; border-radius: 8px; background: #fff; font-size: 12px; }
    .no b { display: block; font-size: 13px; } .no small { display: block; color: #6a5f75; } .no em { display: block; font-style: normal; color: #c0392b; font-size: 11px; }
    .no.ok { background: #e9fbe0; } .no.pode { background: #fff4c7; box-shadow: 0 0 0 2px #ffd166; } .no.bloq { opacity: .6; cursor: default; }
    @media (max-width: 640px) { .ramos { grid-template-columns: repeat(2, 1fr); } }
    #magias { position: fixed; right: 12px; bottom: 70px; display: flex; flex-direction: column; gap: 6px; }
    .magia { position: relative; overflow: hidden; padding: 6px 10px 6px 26px; text-align: left; font-weight: 700; font-size: 12px; border: 2px solid #3a2f45; border-radius: 8px; background: #fff; }
    .magia span { position: absolute; left: 7px; top: 6px; color: #8a7f95; } .magia i { position: absolute; left: 0; bottom: 0; height: 3px; background: #3a2f45; }
    .magia.faisca { background: #ffd8b8; } .magia.agua { background: #cfeeff; } .magia.pedra { background: #e2ded9; } .magia.vento { background: #effcff; } .magia.chuva { background: #ffb8a0; }
    .magia.sem-mana { opacity: .45; }
    body.toque #magias { right: max(24px, env(safe-area-inset-right)); bottom: calc(max(8px, env(safe-area-inset-bottom)) + 184px); }
    body.toque .magia { padding: 8px 10px 8px 26px; }
    body.espectador #magias { display: none; }
    body.toque #avisos { top: 34%; }
    /* Construção no celular: o botão de ação confirma; o ✕ fica pequeno acima dele; nada cobre o mapa */
    body.toque.construindo #btn-ok { display: none; }
    body.toque.construindo #btn-cancelar { top: auto; left: auto; right: max(34px, env(safe-area-inset-right));
      bottom: calc(max(8px, env(safe-area-inset-bottom)) + 184px); width: 64px; height: 44px; padding: 0; font-size: 16px; }
    body.toque.construindo #missao, body.toque.construindo #magias { display: none !important; }
    body.toque #dica-construcao { top: calc(max(12px, env(safe-area-inset-top)) + 96px); bottom: auto; font-size: 12px; max-width: calc(100vw - 90px); left: 12px; right: auto; margin: 0; }
    #menu { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; box-sizing: border-box; overflow: auto;
      background: radial-gradient(circle at 50% 40%, #5fa3d9, #3b6ea8 60%, #2b4f7e); }
    #menu[hidden] { display: none; }
    #menu .cartao { width: min(460px, 100%); background: #f6efe0; border: 3px solid #3a2f45; border-radius: 14px; padding: 18px; color: #3a2f45; box-shadow: 0 8px 0 #2b2238; }
    #menu h1 { margin: 0; font-size: 44px; letter-spacing: 2px; text-align: center; color: #ff8fb1; text-shadow: 3px 3px 0 #3a2f45; }
    #menu .sub { text-align: center; margin: 4px 0 14px; color: #6a5f75; }
    #menu h2 { font-size: 14px; margin: 12px 0 6px; }
    #menu .opcoes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    #menu .opcoes button { padding: 8px 4px; border: 2px solid #3a2f45; border-radius: 8px; background: #fff; }
    #menu .opcoes button.sel { background: #ffd166; box-shadow: inset 0 -3px 0 #e0a83a; }
    #menu .opcoes small { display: block; color: #6a5f75; font-size: 11px; }
    #menu .personagens { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    #menu .personagens button { aspect-ratio: 1; border: 2px solid #3a2f45; border-radius: 8px; background-color: #fff;
      background-size: 400% 700%; background-position: 0 0; image-rendering: pixelated; padding: 0; }
    #menu .personagens button.sel { background-color: #ffd166; box-shadow: inset 0 -3px 0 #e0a83a; }
    #menu .creditos { font-size: 10px; color: #8a7f95; text-align: center; margin: 10px 0 0; }
    #menu .creditos a { color: inherit; }
    #menu .acoes { display: flex; gap: 8px; margin-top: 16px; }
    #menu .acoes button { flex: 1; padding: 12px; font-size: 16px; font-weight: 800; border: 2px solid #3a2f45; border-radius: 10px; background: #fff; }
    #menu .acoes .principal { background: #8fd27a; }
    #menu .aviso-novo { font-size: 11px; color: #8a7f95; text-align: center; margin: 8px 0 0; }
    #missao { position: fixed; left: 12px; top: calc(max(12px, env(safe-area-inset-top)) + 96px); width: 200px; padding: 8px 10px; font-size: 12px; cursor: pointer; }
    #missao b { display: block; font-size: 13px; color: #ffd166; } #missao small { opacity: .7; }
    #missao.fechada p { display: none; }
    body.toque #missao { top: calc(max(12px, env(safe-area-inset-top)) + 96px); width: 46vw; max-width: 220px; font-size: 11px; box-sizing: border-box; }
    #missao.feita { animation: feita .6s; } @keyframes feita { 50% { transform: scale(1.06); background: #6db35ccc; } }
    #status .icones { display: flex; gap: 4px; } #status .icones button { background: none; border: 0; padding: 0 2px; font-size: 13px; color: #f6efe0; opacity: .85; }
    #cristal { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(360px, calc(100vw - 24px)); max-height: calc(100vh - 40px);
      overflow: auto; background: #f6efe0; border: 2px solid #3a2f45; border-radius: 12px; padding: 12px; color: #3a2f45; z-index: 9; box-sizing: border-box; }
    #cristal h3 { margin: 0 0 6px; display: flex; justify-content: space-between; color: #7a4fd0; }
    #cristal h4 { margin: 10px 0 4px; font-size: 13px; } #cristal p { margin: 4px 0; font-size: 13px; } #cristal .dica { color: #8a7f95; font-size: 12px; }
    #cristal ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
    #cristal li { display: flex; align-items: center; gap: 6px; font-size: 13px; padding: 4px 6px; border-radius: 6px; background: #fff; }
    #cristal li img { width: 18px; height: 18px; } #cristal li b { margin-left: auto; } #cristal li.ok { background: #e9fbe0; } #cristal li.falta b { color: #c0392b; }
    #cristal .expandir { width: 100%; margin-top: 10px; padding: 10px; font-weight: 800; font-size: 15px; border: 2px solid #3a2f45; border-radius: 10px; background: #c39bff; }
    #cristal .expandir:disabled { opacity: .5; }
    #bau { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(420px, calc(100vw - 24px)); max-height: calc(100vh - 40px);
      overflow: auto; background: #f6efe0; border: 2px solid #3a2f45; border-radius: 12px; padding: 12px; color: #3a2f45; z-index: 9; box-sizing: border-box; }
    #bau h3 { margin: 0 0 4px; display: flex; justify-content: space-between; color: #8a5a3c; } #bau h4 { margin: 10px 0 4px; font-size: 13px; } #bau h4 small { color: #8a7f95; font-weight: 400; }
    #bau .dica { color: #8a7f95; font-size: 12px; margin: 0; } #bau .grade { display: flex; flex-wrap: wrap; gap: 6px; } #bau .vazio { color: #8a7f95; font-size: 12px; }
    #barra[data-cheia="true"] { box-shadow: 0 0 0 3px #e0503c; }
    .energia { font-size: 12px; color: #c3a6ff; } .energia.baixa { color: #ff8080; animation: pisca 1s infinite; } @keyframes pisca { 50% { opacity: .4 } }
    .bar.energia i { background: #a98bff; } #cristal .bar.energia { height: 16px; } #cristal .bar.energia span { line-height: 16px; font-size: 11px; color: #fff; }
    #cristal .recarga { display: flex; gap: 6px; margin: 4px 0; } #cristal .recarga button { flex: 1; display: flex; align-items: center; justify-content: center; gap: 4px; padding: 6px;
      border: 2px solid #3a2f45; border-radius: 8px; background: #fff; font-weight: 700; } #cristal .recarga button:disabled { opacity: .45; } #cristal .recarga img { width: 18px; height: 18px; }
    #cristal .diario { font-size: 12px; } #cristal .diario li { background: #fff4e0; }
    #alerta-fora { display: none; position: fixed; left: 0; right: 0; margin: 0 auto; width: max-content; max-width: calc(100vw - 24px); top: calc(max(12px, env(safe-area-inset-top)) + 54px);
      padding: 5px 12px; font-size: 12px; font-weight: 700; color: #fff; background: #c0392bdd; border: 2px solid #3a2f45; border-radius: 10px; z-index: 6; pointer-events: none; }
    body.fora #alerta-fora { display: block; }
    #nivel { position: fixed; top: max(12px, env(safe-area-inset-top)); right: 12px; padding: 8px 10px; font-size: 13px; max-width: 220px; }
    #nivel .req { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 2px; } #nivel .ok { color: #9be38a; } #nivel small { opacity: .75; }
    #avisos { position: fixed; top: 12px; left: 0; right: 0; margin: 0 auto; display: grid; gap: 6px; pointer-events: none; z-index: 6; width: max-content; max-width: 60vw; }
    .aviso { background: #2b2238ee; color: #fff; padding: 6px 12px; border-radius: 8px; font-size: 14px; animation: some 2.6s forwards; text-align: center; }
    @keyframes some { 0%,80% { opacity: 1 } 100% { opacity: 0 } }
    #ajuda { position: fixed; bottom: 12px; left: 12px; padding: 6px 10px; font-size: 12px; line-height: 1.5; max-width: 200px; }
    #dica-construcao { position: fixed; left: 0; right: 0; margin: 0 auto; width: max-content; max-width: calc(100vw - 40px); box-sizing: border-box; text-align: center; bottom: 76px; display: none; padding: 6px 12px; font-size: 13px; white-space: nowrap; }
    body.construindo #dica-construcao { display: block; }

    /* Controles de toque */
    #joy, #btn-acao, #btn-ok, #btn-cancelar, #zoom { display: none; }
    body.toque #ajuda { display: none; }
    body.toque #joy { display: block; position: fixed; left: max(20px, env(safe-area-inset-left)); bottom: 90px; width: 120px; height: 120px;
      border-radius: 50%; background: #ffffff22; border: 2px solid #ffffff55; touch-action: none; }
    body.toque #joy.ativo { opacity: 1; } body.toque #joy { opacity: .55; transition: opacity .15s; }
    #joy-pino { position: absolute; left: 35px; top: 35px; width: 50px; height: 50px; border-radius: 50%; background: #ffffffaa; border: 2px solid #3a2f45; }
    body.toque #btn-acao { display: grid; place-items: center; position: fixed; right: max(24px, env(safe-area-inset-right)); bottom: 100px;
      width: 84px; height: 84px; border-radius: 50%; background: #8fd27a; border: 3px solid #3a2f45; font-weight: 800; font-size: 14px; touch-action: none; }
    body.toque.construindo #btn-acao { background: #ffd166; }
    body.construindo #btn-ok, body.construindo #btn-cancelar { display: block; position: fixed; top: 50%; padding: 12px 16px; font-size: 18px; font-weight: 800;
      border: 2px solid #3a2f45; border-radius: 10px; }
    body.construindo #btn-ok { right: 12px; background: #8fd27a; } body.construindo #btn-cancelar { left: 12px; background: #f6efe0; }
    body.toque #zoom { display: flex; gap: 6px; position: fixed; right: 12px; top: calc(max(12px, env(safe-area-inset-top)) + 104px); }
    body.toque #btn-ranking, body.toque #btn-hab, body.toque #btn-craft { left: auto; right: 12px; bottom: auto; width: 48px; height: 48px; padding: 0;
      font-size: 0; border-radius: 50%; display: grid; place-items: center; }
    body.toque #btn-craft::before { content: '🛠'; font-size: 22px; } body.toque #btn-ranking::before { content: '🏆'; font-size: 22px; }
    body.toque #btn-hab::before { content: '✦'; font-size: 22px; } body.toque #btn-hab .badge { position: absolute; top: -4px; right: -4px; font-size: 11px; }
    body.toque #btn-craft { top: calc(max(12px, env(safe-area-inset-top)) + 96px); }
    body.toque #btn-hab { top: calc(max(12px, env(safe-area-inset-top)) + 152px); }
    body.toque #btn-ranking { top: calc(max(12px, env(safe-area-inset-top)) + 208px); }
    body.toque #zoom { display: none !important; }
    body.toque #nivel { font-size: 11px; max-width: 46vw; padding: 6px 8px; }
    body.toque #nivel small { display: none; }
    body.toque #btn-acao { font-size: 13px; text-align: center; line-height: 1.1; padding: 4px; }
    body.toque.construindo #zoom { display: none; }
    #zoom button { width: 40px; height: 40px; border-radius: 8px; border: 2px solid #3a2f45; background: #f6efe0cc; font-size: 20px; font-weight: 800; }
    body.toque #barra { bottom: max(8px, env(safe-area-inset-bottom)); max-width: calc(100vw - 24px); }
    body.toque #dica-construcao { bottom: auto; top: 110px; }
    body.toque #joy { bottom: calc(max(8px, env(safe-area-inset-bottom)) + 76px); }
    body.toque #btn-acao { bottom: calc(max(8px, env(safe-area-inset-bottom)) + 90px); }
    body.toque #status { width: 140px; }
    body.toque #craft { left: 8px; right: 8px; top: 60px; bottom: auto; width: auto; max-height: calc(100vh - 140px); }
    @media (max-width: 600px) {
      .slot { width: 38px; height: 38px; } .slot img { width: 26px; height: 26px; }
      #nivel { font-size: 12px; max-width: 170px; }
      #dica-construcao { white-space: normal; }
    }
  </style>
</head>
<body>
  <div id="menu"></div>
  <div id="jogo"></div>
  <div id="missao" class="painel" hidden></div>
  <div id="ajuda" class="painel">WASD/setas: andar · Espaço: coletar/atacar/usar (Cristal, baú, plantação, dormir) · C: criar · R: ranking · K: habilidades · 1–5: magias · clique na comida para comer · roda: zoom</div>
  <div id="status" class="painel"></div>
  <div id="nivel" class="painel"></div>
  <div id="avisos"></div>
  <div id="alerta-fora">⚠ Sua ilha está desprotegida</div>
  <div id="barra" class="painel"></div>
  <div id="dica-construcao" class="painel"></div>
  <button id="btn-craft">Criar (C)</button>
  <button id="btn-ranking">🏆 Ranking</button>
  <button id="btn-hab">✦ Habilidades</button>
  <div id="habilidades" hidden></div>
  <div id="cristal" hidden></div>
  <div id="bau" hidden></div>
