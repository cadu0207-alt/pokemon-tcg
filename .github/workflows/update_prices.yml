name: Atualizar Preços das Cartas

on:
  # Cron semanal DESATIVADO (jul/2026): a Liga Pokémon usa Cloudflare e bloqueia
  # os IPs de datacenter do GitHub Actions ("Access denied ... used Cloudflare
  # to restrict access" — confirmado via screenshot de debug). A atualização
  # de preços agora roda localmente (scripts/run_update_prices_local.bat via
  # Agendador de Tarefas do Windows), que usa o IP residencial do Eduardo.
  # Mantido aqui só pra permitir disparo manual/teste futuro.
  # schedule:
  #   - cron: '0 10 * * 0'
  workflow_dispatch:
    # Permite rodar manualmente pela aba Actions do GitHub

jobs:
  update-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Necessário para fazer commit e push

    steps:
      - name: Checkout (branch Rotower)
        uses: actions/checkout@v4
        with:
          ref: Rotower

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependências Python
        run: pip install -r scripts/requirements.txt

      - name: Instalar Chromium (Playwright)
        run: playwright install chromium --with-deps

      - name: Atualizar preços
        run: python scripts/update_prices.py

      - name: Upload screenshots de debug (se algum set não retornou cards)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: debug_screenshots/
          if-no-files-found: ignore
          retention-days: 3

      - name: Commit e push (apenas se houver mudanças)
        run: |
          git config --global user.name  'Price Bot 🤖'
          git config --global user.email 'actions@github.com'
          if git diff --quiet cards_*.js; then
            echo "Nenhuma mudança de preço detectada — nada a commitar."
          else
            CHANGED=$(git diff --name-only cards_*.js | tr '\n' ' ')
            git add cards_*.js
            git commit -m "chore: atualiza preços [$(date '+%Y-%m-%d')] | $CHANGED | fonte: ligapokemon.com.br (menor preço)"
            git push
            echo "✅ Push realizado com sucesso."
          fi
