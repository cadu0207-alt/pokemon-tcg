<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Central ANCORD 2027</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: mesa de operações — barra fixa de abas no topo, painel de cotação (fita) com contagem regressiva, conteúdo em coluna única larga */
:root{
  --bg:#EEF1F0; --panel:#FFFFFF; --ink:#14201D; --muted:#5B6B66; --line:#D5DDDA;
  --accent:#0E6B5C; --accent-ink:#FFFFFF; --accent-soft:#D9ECE7;
  --up:#1F8A4C; --down:#C0392B; --warn:#B7791F; --tape:#10211D; --tape-ink:#DDEBE6;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1513; --panel:#15201D; --ink:#E4ECE9; --muted:#93A6A0; --line:#273632;
  --accent:#3DBFA6; --accent-ink:#06201A; --accent-soft:#163A33;
  --up:#4CC37E; --down:#F0796B; --warn:#E3B04B; --tape:#050C0A; --tape-ink:#BFD8D0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1513; --panel:#15201D; --ink:#E4ECE9; --muted:#93A6A0; --line:#273632;
  --accent:#3DBFA6; --accent-ink:#06201A; --accent-soft:#163A33;
  --up:#4CC37E; --down:#F0796B; --warn:#E3B04B; --tape:#050C0A; --tape-ink:#BFD8D0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--tape)}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.tape{background:var(--tape);color:var(--tape-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tape .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-block:12px}
.brand{font-family:var(--f-display);font-stretch:80%;font-weight:800;font-size:20px;letter-spacing:.02em;text-transform:uppercase}
.brand small{font-weight:500;opacity:.7;letter-spacing:.08em;margin-left:6px;font-size:12px}
.ticks{display:flex;gap:18px;flex-wrap:wrap;font-family:var(--f-mono);font-size:13px;margin-left:auto}
.ticks b{color:#fff;font-weight:600}
.tbtn{font:600 13px var(--f-mono);background:var(--accent);color:var(--accent-ink);border:0;border-radius:99px;padding:4px 12px;cursor:pointer}
.tbtn.on{background:var(--down);color:#fff}
.tbtn b{color:inherit!important}
.tick-up{color:var(--up)} .tick-down{color:var(--down)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;border-top:1px solid rgba(255,255,255,.08)}
nav.tabs button{background:none;border:0;color:var(--tape-ink);font:600 14px var(--f-body);padding:10px 14px;cursor:pointer;white-space:nowrap;opacity:.7;border-bottom:3px solid transparent}
nav.tabs button[aria-selected="true"]{opacity:1;border-bottom-color:var(--accent);color:#fff}
nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
main{padding-block:24px 64px}
h1,h2,h3{font-family:var(--f-display);font-stretch:85%;text-wrap:balance;margin:0}
h2{font-size:24px;font-weight:800;letter-spacing:.01em}
h3{font-size:17px;font-weight:700}
.sub{color:var(--muted);margin:4px 0 0}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
section.view{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
section.view>*{min-width:0}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px;min-width:0}
.stat{font-family:var(--f-mono);font-size:32px;font-weight:600;line-height:1.1;margin-top:6px}
.stat small{font-size:14px;color:var(--muted);font-weight:400}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:600 14px var(--f-body);border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,input[type=date],input[type=number]{font:15px var(--f-body);padding:7px 10px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
/* barras por módulo */
.mods{display:grid;gap:10px}
.mod{display:grid;grid-template-columns:56px 1fr 64px;gap:10px;align-items:center}
.mod .code{font-family:var(--f-mono);font-weight:600;font-size:13px}
.mod .name{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{position:relative;height:10px;background:var(--accent-soft);border-radius:5px;overflow:visible;margin-top:3px}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:5px;background:var(--accent)}
.bar i.bad{background:var(--down)} .bar i.mid{background:var(--warn)} .bar i.ok{background:var(--up)}
.bar .cut{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.6}
.pct{text-align:right;font-family:var(--f-mono);font-size:13px}
.chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.chip.corte{border-color:var(--down);color:var(--down)}
.chip.leve{border-color:var(--warn);color:var(--warn)}
.chip.marco{border-color:var(--accent);color:var(--accent)}
.chip.d-facil{border-color:var(--accent);color:var(--accent)}
.chip.d-media{border-color:var(--warn);color:var(--warn)}
.chip.d-dificil{border-color:var(--down);color:var(--down)}
.mchk{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.mchk button{font:inherit;font-size:13px;padding:5px 10px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;min-height:32px}
.mchk button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mchk button:disabled{opacity:.4;cursor:not-allowed}
.gauge{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.gauge .stat{margin:0}
.focus{display:grid;gap:8px;margin-top:8px}
.focus>div{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:8px}
.mbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}
.mbar i{display:block;height:100%;background:var(--accent)}
.mbar i.lo{background:var(--down)}.mbar i.md{background:var(--warn)}
.evo svg{width:100%;height:auto;display:block}
.evo .ax{stroke:var(--line)}.evo .tl{fill:var(--muted);font-size:10px;font-family:inherit}
.evo .ln{fill:none;stroke:var(--accent);stroke-width:2}.evo .bar{fill:var(--accent-soft)}
.evo .ref{stroke:var(--warn);stroke-dasharray:4 3}.evo .ok{fill:var(--accent)}.evo .no{fill:var(--down)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.cov td .mbar{margin:0;min-width:60px}
.lawv{display:grid;gap:10px}
.lawbar{position:static;z-index:2;background:var(--bg);padding:8px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lawbar input{flex:1;min-width:160px;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.lawart{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;line-height:1.6;scroll-margin-top:70px}
.lawart.hit{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.lawart p{margin:0 0 6px}.lawart .ai{padding-left:14px}
.lawart mark{background:var(--accent-soft);color:inherit;padding:0 2px;border-radius:3px}
.lawidx{display:flex;flex-wrap:wrap;gap:4px}.lawidx button{font:inherit;font-size:12px;padding:3px 7px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--ink);cursor:pointer;min-width:34px}
.lawh{margin:10px 0 0;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
button.lnk{font:inherit;background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer}
.mot{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.mot button{font:inherit;font-size:13px;padding:5px 10px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;min-height:32px}
.mot button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.fc{min-height:220px;display:flex;flex-direction:column;justify-content:center;gap:12px;text-align:center;padding:24px}
.fc .front{font-size:1.15em;line-height:1.5}.fc .back{font-size:1.6em;font-weight:700;color:var(--accent)}
select{max-width:100%;min-width:0;text-overflow:ellipsis}
.lawq .row>b{min-width:0}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px;margin:14px 0}
.flow .st{flex:1 1 140px;background:var(--accent-soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.92em;line-height:1.4}
.flow .st b{display:block;color:var(--accent);font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.flow .ar{align-self:center;color:var(--muted);font-weight:700}
@media(max-width:560px){.flow{flex-direction:column}.flow .ar{transform:rotate(90deg);align-self:center}}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto}
.modal{background:var(--panel);color:var(--ink);border-radius:14px;max-width:640px;width:100%;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3);display:grid;gap:14px}
.modal h3{margin:0}.modal .x{justify-self:end}
.pill{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:8px}
.pill blockquote{margin:0;max-height:220px;overflow:auto;font-size:.92em;line-height:1.55;border-left:3px solid var(--accent);padding-left:10px}
.steps{display:grid;gap:8px;counter-reset:st}
.steps button{display:flex;gap:12px;align-items:center;text-align:left;font:inherit;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);padding:10px 12px;cursor:pointer;min-height:48px}
.steps button::before{counter-increment:st;content:counter(st);font-weight:700;width:26px;height:26px;border-radius:99px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.steps button.done{opacity:.55}.steps small{display:block;color:var(--muted)}
.chip.now{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
/* cronograma */
.weeks{display:grid;gap:10px}
.week{display:grid;grid-template-columns:92px 1fr;gap:14px;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.week.current{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.week.past{opacity:.72}
.week .when{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.week .when b{display:block;font-size:20px;color:var(--ink);font-family:var(--f-display);font-stretch:80%}
.tasks{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:4px}
.tasks li{display:flex;gap:8px;align-items:flex-start}
.tasks input{width:18px;height:18px;flex:none;cursor:pointer}
.tasks a,.prose a,.rl a{color:var(--accent);font-weight:600;text-underline-offset:2px}
.readbox{border:1px solid var(--accent);border-radius:8px;padding:12px 16px;margin:0 0 18px;background:var(--panel)}
.readbox>b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-bottom:6px}
.readbox ul{margin:0 0 6px;padding-left:18px;display:grid;gap:6px}
.readbox li span{display:block;font-size:.9em;color:var(--muted)}
.readbox small{color:var(--muted)}
.rl{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:rl}
.rl li{display:grid;grid-template-columns:28px 22px 1fr;gap:10px;align-items:start;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel);counter-increment:rl}
.rl li::before{content:counter(rl);font-family:var(--f-mono);font-weight:600;color:var(--muted)}
.rl li.done{opacity:.65}
.rl li.done a{text-decoration:line-through}
.rl input{width:18px;height:18px;margin-top:3px;cursor:pointer}
.rl .meta{font-size:13px;color:var(--muted)}
.tasks input{margin-top:4px;accent-color:var(--accent)}
.tasks .done span{text-decoration:line-through;color:var(--muted)}
/* edital */
details.ed{background:var(--panel);border:1px solid var(--line);border-radius:8px}
details.ed summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center}
details.ed summary::-webkit-details-marker{display:none}
details.ed .body{padding:0 16px 14px;display:grid;gap:6px}
.topic{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.topic button{font:600 12px var(--f-body);border-radius:99px;padding:3px 10px;border:1px solid var(--line);background:none;color:var(--muted);cursor:pointer;min-width:92px}
.st1{border-color:var(--warn)!important;color:var(--warn)!important}
.st2{border-color:var(--accent)!important;color:var(--accent)!important}
.st3{background:var(--up)!important;border-color:var(--up)!important;color:#fff!important}
.prog{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
/* questões */
.qcard{display:grid;gap:14px}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.qtext{font-size:18px;line-height:1.55;max-width:68ch}
.opts{display:grid;gap:8px}
.opt{text-align:left;font:16px var(--f-body);display:grid;grid-template-columns:28px 1fr;gap:8px;padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{font-family:var(--f-mono);font-weight:600;color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.nt{color:var(--muted);font-style:italic;font-weight:400}
.sig{margin-top:10px;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--accent) 7%,var(--panel));border:1px solid var(--line);display:grid;gap:3px;font-size:14px}
details.help{margin-top:2px}details.help summary{cursor:pointer;color:var(--muted);font-size:14px;list-style:none}details.help summary::-webkit-details-marker{display:none}
details.more{border:1px dashed var(--line);border-radius:12px;padding:10px 14px}details.more>summary{cursor:pointer;font-weight:600;color:var(--muted)}details.more[open]>summary{margin-bottom:12px}
details.more>div{display:grid;gap:16px}
.bnav{display:none}
@media (max-width:700px){
  nav.tabs{display:none}
  main{padding-bottom:96px}
  .bnav{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--tape);border-top:1px solid rgba(255,255,255,.1);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
  .bnav button{background:none;border:0;color:var(--tape-ink);opacity:.75;font:600 11px var(--f-body);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;cursor:pointer;position:relative}
  .bnav button .i{font-size:19px;line-height:1}
  .bnav button[aria-current="page"]{opacity:1;color:#fff}
  .bnav .bd{position:absolute;top:2px;right:18%;background:var(--down);color:#fff;border-radius:99px;font:700 10px var(--f-mono);padding:0 5px}
}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:flex;align-items:flex-end}
.sheet>div{background:var(--panel);width:100%;border-radius:16px 16px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:8px}
.sheet button.it{display:flex;gap:12px;align-items:center;text-align:left;background:none;border:1px solid var(--line);border-radius:10px;padding:12px;font:600 15px var(--f-body);color:var(--ink);cursor:pointer}
.ring{--p:0;width:86px;height:86px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring>div{width:68px;height:68px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font:700 18px var(--f-mono)}
.today{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.today .goals{display:grid;gap:4px;font-size:14px;min-width:0;flex:1}
.today .goals .ok{color:var(--up)}
.qact{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.qact button{font:600 13px var(--f-body);border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:99px;padding:6px 12px;cursor:pointer}
.qact button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.rep{display:grid;gap:8px;margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:10px}
.rep textarea,.rep select{font:15px var(--f-body);padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.kbdh{display:inline}@media (max-width:700px),(hover:none){.kbdh{display:none}}
.kbd{font:600 11px var(--f-mono);border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--muted)}
.conf{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;padding:10px;border:1px dashed var(--accent);border-radius:10px}
.conf button{font:600 14px var(--f-body);padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.conf button:hover{border-color:var(--accent)}
.expl{margin-top:10px}.expl textarea{width:100%;min-height:64px;font:15px var(--f-body);padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);box-sizing:border-box}
.cal{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;margin-top:8px}
.secnav button.mast{border-color:var(--up)}.secnav button.mast::after{content:" ★";color:var(--up)}
.pre{border-left:4px solid var(--accent)}
.opt.right{border-color:var(--up);background:color-mix(in srgb,var(--up) 14%,var(--panel))}
.opt.wrong{border-color:var(--down);background:color-mix(in srgb,var(--down) 12%,var(--panel))}
.opt:disabled{cursor:default}
.why{border-left:3px solid var(--accent);padding:8px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0;max-width:72ch}
.fix{border:1px solid var(--warn);border-radius:8px;padding:12px 14px;display:grid;gap:6px;max-width:72ch;background:color-mix(in srgb,var(--warn) 8%,var(--panel))}
.fix>b{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--warn)}
.fix a{color:var(--accent);font-weight:600}
.lawq{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--panel)}
.lawq blockquote{max-height:340px;overflow:auto;margin:6px 0 0;padding:8px 12px;border-left:3px solid var(--accent);background:var(--accent-soft);font-family:Georgia,'Times New Roman',serif;font-size:15px;line-height:1.55;white-space:normal}
.weak{display:grid;gap:8px}
.weak>div{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.why .src{font-size:13px;color:var(--muted);margin-top:4px}
.grid-nav{display:flex;flex-wrap:wrap;gap:4px}
.grid-nav button{width:34px;height:30px;font:600 12px var(--f-mono);border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:4px;cursor:pointer}
.grid-nav button.ans{background:var(--accent-soft);border-color:var(--accent)}
.grid-nav button.cur{outline:2px solid var(--ink)}
.timer{font-family:var(--f-mono);font-size:22px;font-weight:600}
.timer.low{color:var(--down)}
.verdict{font-family:var(--f-display);font-stretch:80%;font-size:30px;font-weight:800}
.verdict.ok{color:var(--up)} .verdict.no{color:var(--down)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}
.links{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.links a{display:block;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);text-decoration:none}
.links a:hover{border-color:var(--accent)}
.links a small{display:block;color:var(--muted)}
.hrs{display:flex;gap:4px;align-items:flex-end;height:64px;margin-top:10px}
.hrs div{flex:1;background:var(--accent-soft);border-radius:3px 3px 0 0;position:relative;min-height:2px}
.hrs div.on{background:var(--accent)}
.hrs-l{display:flex;gap:4px;font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.hrs-l span{flex:1;text-align:center}
.note{font-size:14px;color:var(--muted)}
.banner{padding:10px 14px;border-radius:6px;border:1px solid var(--warn);color:var(--ink);background:color-mix(in srgb,var(--warn) 12%,var(--panel))}
/* apostila */
.chapters{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.chap{display:grid;gap:6px;text-align:left;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;cursor:pointer}
.chap:hover:not(:disabled){border-color:var(--accent)}
.chap:disabled{cursor:default;opacity:.6}
.chap .bar{margin-top:6px}
.reader{display:grid;gap:16px}
.secnav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.secnav button{flex:none;font:600 13px var(--f-body);border-radius:99px;padding:5px 12px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;white-space:nowrap}
.secnav button.cur{border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}
.secnav button.read::before{content:"✓ ";color:var(--up)}
.prose{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:clamp(18px,4vw,36px);font-size:calc(17px * var(--fs,1));line-height:1.65}
.prose>*{max-width:68ch}
.prose h3{font-size:calc(24px * var(--fs,1));margin-bottom:4px}
.prose h4{font-family:var(--f-display);font-stretch:85%;font-size:calc(18px * var(--fs,1));margin:22px 0 6px}
.prose p{margin:0 0 12px}
.prose ul{margin:0 0 14px;padding-left:22px;display:grid;gap:4px}
.prose .tbl{margin:6px 0 16px;max-width:100%}
.prose table{font-size:calc(15px * var(--fs,1))}
.prose .art{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.tip,.trap{padding:10px 14px;border-radius:6px;margin:4px 0 16px}
.tip{background:var(--accent-soft);border-left:3px solid var(--accent)}
.trap{background:color-mix(in srgb,var(--down) 10%,var(--panel));border-left:3px solid var(--down)}
.tip>b:first-child,.trap>b:first-child{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px}
.resume{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
@media (max-width:560px){
  .week{grid-template-columns:1fr}
  .mod{grid-template-columns:44px 1fr 52px}
  .ticks{margin-left:0}
  .qtext{font-size:17px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

(function(){

const BUILD='1793560755';
const sb=window.supabase.createClient(SB_URL,SB_KEY);
const CONTENT_COLS=['questions','chapters','dispositivos'];
let ME=null, CONTENT=null, UDOCS={};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function gate(html){let el=document.getElementById('gate');if(!el){el=document.createElement('div');el.id='gate';document.body.appendChild(el)}
  el.innerHTML=html?`<div class="gate-bg"><div class="gate-box">${html}</div></div>`:''}
const css=document.createElement('style');css.textContent=`.gate-bg{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:16px}

  <input id="g-email" type="email" placeholder="E-mail" autocomplete="username"><input id="g-pass" type="password" placeholder="Senha" autocomplete="current-password">

document.addEventListener('click',async e=>{const id=e.target&&e.target.id;

async function decrypt(){const{data,error}=await sb.from('ancord_keys').select('k').eq('id','content-v1').single();if(error||!data)throw new Error('sem chave');
  const raw=Uint8Array.from(atob(data.k),c=>c.charCodeAt(0));const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  const buf=new Uint8Array(await (await fetch('content.bin?v='+BUILD)).arrayBuffer());
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(0,12)},key,buf.slice(12));
  const txt=await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text();return JSON.parse(txt)}
async function loadUserDocs(){let from=0;const step=1000;for(;;){const{data,error}=await sb.from('ancord_user_docs').select('path,data').eq('user_id',ME.id).range(from,from+step-1);if(error)throw error;
  data.forEach(r=>UDOCS[r.path]=r.data);if(data.length<step)break;from+=step}}
function snapDoc(id,data){return{id,exists:data!==undefined,data:()=>data}}
const db={
  collection(name){return{
    onSnapshot(cb,err){setTimeout(()=>{try{let docs;if(CONTENT_COLS.includes(name)){const c=CONTENT[name]||{};docs=Object.keys(c).map(k=>snapDoc(k,c[k]))}
      else{const p=name+'/';docs=Object.keys(UDOCS).filter(k=>k.startsWith(p)&&!k.slice(p.length).includes('/')).map(k=>snapDoc(k.slice(p.length),UDOCS[k]))}
      cb({docs})}catch(e){err&&err(e)}},0);return()=>{}},
    add(data){const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);return db.doc(name+'/'+id).set(data).then(()=>({id}))}}},
  doc(path){return{
    onSnapshot(cb,err){setTimeout(()=>{try{cb(snapDoc(path.split('/').pop(),UDOCS[path]))}catch(e){err&&err(e)}},0);return()=>{}},
    async set(data){UDOCS[path]=data;const{error}=await sb.from('ancord_user_docs').upsert({user_id:ME.id,path,data,updated_at:new Date().toISOString()});if(error)throw error}}}
};

   <p class="muted" style="margin:0">Quem está nesta lista entra com a conta do MyDeck (o mesmo e-mail) e tem progresso próprio.</p>

   <input id="acc-email" type="email" placeholder="E-mail da conta MyDeck do colega"><input id="acc-note" placeholder="Nome (opcional)"><button class="btn pri" id="acc-add">Liberar acesso</button>
   <div class="lbl" style="margin-top:8px">Questões reportadas (${(reps||[]).length})</div>${(reps||[]).map(r=>`<div class="acc-row" style="display:block"><b>${esc(r.path.split('/')[1])}</b> · ${esc(r.data.m||'')} ${r.data.t?'· '+esc(r.data.t):''}<br><span class="muted">${esc((r.data.q||'').slice(0,120))}</span></div>`).join('')||'<p class="muted">Nenhuma.</p>'}
   <button class="btn" id="g-out">Sair da conta (${esc(ME.email)})</button></div></div>`}
function accountChip(admin){const t=document.querySelector('.tape .brand');if(!t)return;const b=document.createElement('button');b.className='tbtn';b.id=admin?'acc-btn':'g-out';b.textContent=admin?'👥 Acessos':'Sair';b.style.marginLeft='8px';t.appendChild(b)}
window.claude={use:async function(){
  gate(`<div class="lbl">Central ANCORD</div><p class="muted">Carregando…</p>`);

function mkOrd(id){const q=Q[id];const n=q.opts.length;const o=[...Array(n).keys()];
  for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[o[i],o[j]]=[o[j],o[i]]}
  const last=LASTPOS[id];let p=o.indexOf(q.ans);
  if(n>1&&last!=null&&p===last){let t;do{t=Math.floor(Math.random()*n)}while(t===p);[o[p],o[t]]=[o[t],o[p]];p=t}
  LASTPOS[id]=p;try{localStorage.setItem('ansPos',JSON.stringify(LASTPOS))}catch(e){}
  return o}
function ordOf(ctx,id){if(!ctx||!Q[id])return Q[id]?[...Array(Q[id].opts.length).keys()]:[];ctx.ord=ctx.ord||{};
  const o=ctx.ord[id];if(!Array.isArray(o)||o.length!==Q[id].opts.length)ctx.ord[id]=mkOrd(id);return ctx.ord[id]}

}

/* score honesto por questão: 1ª resposta (acerto no chute vale 1/3); histórico antigo sem 1ª resposta usa a média */
const itemSc=p=>p.f!=null?p.f:(p.n?(p.ok||0)/p.n:0);
let CAL={}, EXPL={}, STAR={}, REP={}, NOTEOPEN={}, REPOPEN={};
function record(id,ok,cf){
  const p=Object.assign({n:0,ok:0,box:0},P[id]||{});
  if(!p.n&&p.f==null)p.f=ok?(cf==='chute'?1/3:1):0;
  p.n++; if(ok)p.ok++;
  let days;
  if(ok&&cf==='chute'){days=1}                               /* acertou no chute: não sobe de caixa */
  else if(ok){p.box=Math.min((p.box||0)+1,BOX_DAYS.length-1);days=BOX_DAYS[p.box]}
  else{p.box=0;days=cf==='certeza'?0:1}                      /* erro com certeza volta hoje */
  let due=addDays(new Date(),days);const ex=addDays(parseD(CFG.examDate),-2);if(due>ex&&new Date()<ex)due=ex;
  p.due=ymd(due);
  if(!ok&&cf==='certeza')p.hc=today();else if(ok&&cf==='certeza')delete p.hc;
  if(cf){p.cf=cf;const c=CAL[cf]=CAL[cf]||[0,0];c[0]++;if(ok)c[1]++;saveSoon('state/cal',()=>({c:CAL}))}
  p.last=today(); p.lastOk=ok;
  P[id]=p; save('progress/'+id,p);
  const q=Q[id],d=today(),h=HIST[d]=HIST[d]||{n:0,ok:0,m:{}};h.n++;if(ok)h.ok++;
  if(q){const m=h.m[q.mod]=h.m[q.mod]||[0,0];m[0]++;if(ok)m[1]++}
  saveSoon('state/hist',()=>({d:HIST}));
}

function vTreino(){

let tInt=null;
function tickTimer(){
  clearInterval(tInt);
  const upd=()=>{const el=document.getElementById('timer');if(!el||!sim||sim.done){clearInterval(tInt);return}
   const left=sim.dur*60000-(Date.now()-sim.start);if(left<=0){clearInterval(tInt);finishSim();return}
   const h=Math.floor(left/3600000),m=Math.floor(left%3600000/60000),s=Math.floor(left%60000/1000);
   el.textContent=`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;el.classList.toggle('low',left<15*60000)};
  upd();tInt=setInterval(upd,1000);
}

  if(t.id==='tr-dif'){treino.dif=t.value;newDeck(treino.mod);render();return}
  if(t.id==='sm-x'){SC.x=+t.value;saveSC();render();return}
  if(t.id==='sm-dif'){SC.dif=t.value;saveSC();render();return}
  if(t.id==='cfg-date'&&t.value){CFG.examDate=t.value;saveSoon('state/config',()=>CFG);render();return}
  if(t.id==='cfg-h'){CFG.weekTarget=Math.max(2,Math.min(40,+t.value||12));saveSoon('state/config',()=>CFG);render();return}
});

/* ===================== DADOS ===================== */
render();
(async()=>{
  try{db=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){db=null}
  if(!db){dbState='off';render();return}
  dbState='on';
  const err=e=>{console.warn(e);if(e&&e.code==='revoked'){dbState='off';render()}};
  db.collection('questions').onSnapshot(s=>{Q={};s.docs.forEach(d=>{const v=d.data();if(v&&Array.isArray(v.opts))Q[d.id]=Object.assign({id:d.id},v)});render()},err);
  db.collection('progress').onSnapshot(s=>{const n={};s.docs.forEach(d=>n[d.id]=d.data());P=Object.assign(n,P);render()},err);
  db.collection('exams').onSnapshot(s=>{EX=s.docs.map(d=>d.data()).sort((a,b)=>(b.at||0)-(a.at||0));render()},err);
  db.doc('state/edital').onSnapshot(d=>{if(d.exists&&!timers['state/edital'])ED=Object.assign({},d.data().s||{});render()},err);
  db.doc('state/crono').onSnapshot(d=>{if(d.exists)CR=Object.assign({},d.data().done||{});render()},err);
  db.doc('state/horas').onSnapshot(d=>{if(d.exists)HR=Object.assign({},d.data().d||{});render()},err);
  db.collection('chapters').onSnapshot(s=>{CH={};s.docs.forEach(d=>{const v=d.data();if(v&&Array.isArray(v.sections))CH[d.id]=Object.assign({id:d.id},v)});render()},err);
  db.collection('dispositivos').onSnapshot(s=>{DISP={};s.docs.forEach(d=>{const v=d.data();if(v&&v.bundle)Object.assign(DISP,v.bundle);else DISP[d.id]=v});render()},err);
  db.doc('state/leiseca').onSnapshot(d=>{if(d.exists&&!timers['state/leiseca'])RL=Object.assign({},d.data().r||{});render()},err);
  db.doc('state/leitura').onSnapshot(d=>{if(d.exists&&!timers['state/leitura'])RD=Object.assign({},d.data().r||{});render()},err);
  db.doc('state/sim').onSnapshot(d=>{if(!sim&&d.exists&&d.data().s&&!timers['state/sim']){sim=d.data().s;try{localStorage.setItem('sim',JSON.stringify(sim))}catch(e){};render()}},err);
  let trFirst=true;db.doc('state/treino').onSnapshot(d=>{if(!trFirst)return;trFirst=false;if(d.exists){const r=d.data();if(Array.isArray(r.deck)&&(r.at||0)>(treino.at||0)){treino=Object.assign({pk:{}},r);try{localStorage.setItem('treino',JSON.stringify(treino))}catch(e){};render()}}},err);
  db.doc('state/resume').onSnapshot(d=>{if(resumed)return;resumed=true;if(!d.exists||hashTab)return;const r=d.data();
    if(r.ch){ap.lastCh=r.ch;ap.lastSec=r.sec||0;if(r.open!==false){ap.ch=r.ch;ap.sec=r.sec||0}}tab=r.tab||'painel';
    const nm={painel:'Painel',apostila:'Apostila',cronograma:'Cronograma',edital:'Edital',treino:'Questões',revisao:'Revisão',simulado:'Simulado',biblioteca:'Biblioteca'}[tab]||tab;
    resumeNote='Você voltou para onde parou: '+nm+(tab==='apostila'&&r.ch?' · seção '+((r.sec||0)+1):'')+(sim&&!sim.done?' · há um simulado em andamento':'')+'.';
    render();},err);
  db.doc('state/timer').onSnapshot(d=>{if(!d.exists)return;const st=d.data().start;if(st&&!TM){TM={start:st};try{localStorage.setItem('tm',JSON.stringify(TM))}catch(e){};render()}else if(!st&&TM&&Date.now()-TM.start>5000){TM=null;try{localStorage.removeItem('tm')}catch(e){};render()}},err);
  db.doc('state/motivo').onSnapshot(d=>{if(d.exists&&!timers['state/motivo']){const v=d.data();MOT={c:v.c||{},m:v.m||{}};render()}},err);
  db.doc('state/flash').onSnapshot(d=>{if(d.exists&&!timers['state/flash']){FC=Object.assign({},d.data().c||{},FC);render()}},err);
  db.doc('state/hist').onSnapshot(d=>{if(d.exists&&!timers['state/hist'])HIST=Object.assign({},d.data().d||{});render()},err);
  db.doc('state/star').onSnapshot(d=>{if(d.exists&&!timers['state/star'])STAR=Object.assign({},d.data().s||{});},err);
  db.collection('reports').onSnapshot(s=>{REP={};s.docs.forEach(d=>REP[d.id]=d.data())},err);
  db.doc('state/cal').onSnapshot(d=>{if(d.exists&&!timers['state/cal'])CAL=Object.assign({},d.data().c||{});render()},err);
  db.doc('state/expl').onSnapshot(d=>{if(d.exists&&!timers['state/expl'])EXPL=Object.assign({},d.data().x||{});},err);
  db.doc('state/config').onSnapshot(d=>{if(d.exists)CFG=Object.assign(CFG,d.data());render()},err);
})();
</script>
